openapi: 3.2.0
info:
  version: '0.3'
  title: HiPay Marketplace Merchant Group API
  description: The implementation of HiPay Marketplace involves establishing connections between your marketplace platform and HiPay based on a simple integration through a set of APIs.
servers:
- url: https://test-professional.hipay.com/api
tags:
- name: merchant-group
  description: Manage merchant groups
paths:
  /merchant-group/{merchant_group_code}.{_format}:
    get:
      summary: List merchant group member
      description: '### Information


        List merchant group member.'
      parameters:
      - in: path
        name: merchant_group_code
        required: true
        schema:
          type: string
          default: devportaltest
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - in: query
        description: The date from which the member accounts were created
        name: past_date
        schema:
          type: string
          format: date
          default: '2018-01-01'
      - in: query
        description: Account type
        name: account_type[]
        schema:
          type: string
          enum:
          - merchant
          - associator
          - admin
          default: merchant
      - in: query
        description: Number of results to display on each page. Default is 20
        name: nb_result_per_page
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        description: Page number. First page has number 1. Default is 1
        name: page
        schema:
          type: integer
          format: int32
          default: 1
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email address) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '201':
          description: Success response.
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                    description: Status code of the answer.
                  message:
                    type: string
                    description: Description of the answer.
                  merchant_group_name:
                    type: string
                    description: Merchant group name
                  account_type:
                    type: array
                    items:
                      type: string
                    description: List of account type
                  total_merchant:
                    type: integer
                    format: int32
                    description: Total merchant
                  past_date:
                    type: string
                    description: The date from which the member accounts were created
                  nb_result_per_page:
                    type: integer
                    format: int32
                    description: Number of result per page
                  page:
                    type: integer
                    format: int32
                    description: Page number
                  merchants_list:
                    type: array
                    items:
                      type: string
                    description: List of members
        '400':
          description: Validation failed.
        '401':
          description: Authentication failed.
      tags:
      - merchant-group
      security:
      - basicAuth: []
      operationId: getMerchantGroupByMerchantGroupCode}{Format
      x-operation-id-source: derived
  /merchant-group/{merchant_group_code}/count.{_format}:
    get:
      summary: Count merchant group member
      description: '### Information


        Count merchant group member.'
      parameters:
      - in: path
        name: merchant_group_code
        required: true
        schema:
          type: string
          default: devportaltest
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - in: query
        description: The date from which the member accounts were created
        name: past_date
        schema:
          type: string
          format: date
          default: '2018-01-01'
      - in: query
        description: Account type
        name: account_type[]
        schema:
          type: string
          enum:
          - merchant
          - associator
          - admin
          default: merchant
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email address) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '201':
          description: Success response.
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    format: int32
                    description: Status code of the answer.
                  message:
                    type: string
                    description: Description of the answer.
                  merchant_group_name:
                    type: string
                    description: Merchant group name
                  account_type:
                    type: array
                    items:
                      type: string
                    description: List of account type
                  total_merchant:
                    type: integer
                    format: int32
                    description: Total merchant
                  past_date:
                    type: string
                    description: The date from which the member accounts were created
        '400':
          description: Validation failed.
        '401':
          description: Authentication failed.
      tags:
      - merchant-group
      security:
      - basicAuth: []
      operationId: getMerchantGroupByMerchantGroupCodeCount{Format}
      x-operation-id-source: derived
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
