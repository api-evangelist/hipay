          type: string
          example: '2'
          nullable: true
        three_ds_authentication_method:
          description: "3D Secure Authentication Method:\n\n - challenge\n\n - frictionless\n\n - <i>empty</i>"
          example: frictionless
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ThreeDSAuthenticationMethod2'
        three_ds_liability:
