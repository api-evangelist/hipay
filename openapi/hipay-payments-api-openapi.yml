                    Date when the customer created his account on the merchant''s website. (YYYYMMDD)

                    </div> </div> <div class="parameter__description__object"> <div class="parameter__name">password_change</div> <div class="parameter__type">integer</div> <div class="parameter__description">


                    Date when the customer made a password change on his account. (YYYYMMDD)

                    </div> </div> </div> </div> <div class="parameter__description__object"> <div class="parameter__name">purchase</div> <div class="parameter__type">object</div> <div class="parameter__description">


                    Customer''s purchase information

                    <hr> <div class="parameter__description__object"> <div class="parameter__name">count</div> <div class="parameter__type">integer</div> <div class="parameter__description">


                    Number of purchases with the customer''s account during the last six months.

