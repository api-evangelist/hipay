openapi: 3.2.0
info:
  version: '0.3'
  title: HiPay Marketplace Ubo API
  description: The implementation of HiPay Marketplace involves establishing connections between your marketplace platform and HiPay based on a simple integration through a set of APIs.
servers:
- url: https://test-professional.hipay.com/api
tags:
- name: ubo
  description: Manage your Ultimate Beneficial Ownerships (UBO)
paths:
  /ubo.{_format}:
    post:
      description: '### Information

        This is the second step of UBO statement submission.


        - 1 UBO = 1 shareholders with >25% of capital or voting rights)

        - The document uploaded can''t exceed 15MO.'
      operationId: post_Ubo
      parameters:
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '201':
          description: Success response
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: Status code of the answer. 0 => Ubo successfully created
                    format: int32
                    type: integer
                  message:
                    description: Description of the answer.
                    type: string
                  ubo_statement_id:
                    description: Id of the UBO statement.
                    format: int32
                    type: integer
                  ubo_id:
                    description: Id of this UBO.
                    format: int32
                    type: integer
        '400':
          description: Validation failed.
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
        '500':
          description: Server Error.
      summary: Declare UBO
      tags:
      - ubo
      security:
      - basicAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
                  default: 1
                  description: 'Civility title of owner account : `1` : Mr, `2` : Mrs, `3` : Miss.'
                first_name:
                  type: string
                  description: First name of this UBO
                last_name:
                  type: string
                  description: Last name of this UBO
                address:
                  type: string
                  description: Street address
                zip_code:
                  type: string
                  description: The zip or postal code
                city:
                  type: string
                  description: City
                address_country:
                  type: string
                  description: The country code. This two-letter country code complies with ISO 3166-1
                position:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
                  default: 1
                  description: '`1` : CEO, `2` : COO, `3` : CFO, `4` : Shareholder, `5` : Administrator, `6` : Other, `7` : Company manager'
                position_detail:
                  type: string
                  description: If position is OTHER this parameter is needed
                decision_maker:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: '`1` if this beneficial ower is a decision maker, `0` otherwise'
                pep:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: '`1` if this beneficial ower is a politicaly exposed, `0` otherwise'
                id_number:
                  type: string
                  description: The identification number of the ID document (identification_file)
                date_of_birth:
                  type: string
                  default: '1965-11-12'
                  description: Birth date of account owner. Ex. '1965-11-12' for November 12, 1965
                place_of_birth:
                  type: string
                  description: Birth city of account owner.
                country_of_birth:
                  type: string
                  description: Country of birth - This two-letter country code complies with ISO 3166-1
                nationality:
                  type: string
                  description: Nationality - This two-letter country code complies with ISO 3166-1
                share:
                  type: integer
                  default: 25
                  description: Percentage of shares owned by this UBO (25% minimum)
                id_document[file]:
                  type: string
                  description: Passport or ID card - File to upload (jpg, gif, png, pdf)
                  format: binary
                id_document_back[file]:
                  type: string
                  description: Back of file to upload (jpg, gif, png, pdf). Required for id cards in Belgium and Italy
                  format: binary
              required:
              - title
              - first_name
              - last_name
              - address
              - zip_code
              - city
              - address_country
              - position
              - decision_maker
              - pep
              - id_number
              - date_of_birth
              - place_of_birth
              - country_of_birth
              - nationality
              - share
              - id_document[file]
  /ubo/{id}.{_format}:
    delete:
      description: '### Information

        Delete an UBO'
      operationId: delete_ubo
      x-disableTryItOut: true
      parameters:
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - in: path
        name: id
        description: Id of the UBO.
        required: true
        schema:
          type: string
          default: 0
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '200':
          description: 'Success response : UBO has been deleted.'
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: Status code of the answer. 0 => Ubo successfully deleted.
                    format: int32
                    type: integer
                  message:
                    description: Description of the answer.
                    type: string
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
      summary: Delete an UBO
      tags:
      - ubo
      security:
      - basicAuth: []
  /ubo/legal-representative.{_format}:
    post:
      description: '### Information

        This is the second step of UBO statement submission, only in case the legal representative declared for the user space is also a UBO.


        - 1 UBO = 1 shareholders with >25% of capital or voting rights)

        - The document uploaded can''t exceed 15MO.

        - Civility, address and position informations will be retrieved from the user space''s professional informations.

        - ID Document (and its backside if it is needed) will be retrieved from the uploaded KYC (identification) documents for the user space. if they are already uploaded. Otherwise, they can be uploaded here and handled like a KYC, both identifying the user space and this UBO.

        - As there can only be one legal representive per user space, only one UBO/legal representative can be declared.'
      operationId: post_Ubo-legal-representative
      parameters:
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '201':
          description: Success response
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: Status code of the answer.
                    format: int32
                    type: integer
                  message:
                    description: Description of the answer.
                    type: string
                  ubo_statement_id:
                    description: Id of the UBO statement.
                    format: int32
                    type: integer
                  ubo_id:
                    description: Id of this UBO.
                    format: int32
                    type: integer
        '400':
          description: Validation failed.
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
        '500':
          description: Server Error.
      summary: Declare UBO as legal representative
      tags:
      - ubo
      security:
      - basicAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                decision_maker:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: '`1` if this beneficial ower is a decision maker, `0` otherwise'
                id_number:
                  type: string
                  description: The identification number of the ID document (identification_file)
                pep:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: '`1` if this beneficial ower is a politicaly exposed, `0` otherwise'
                date_of_birth:
                  type: string
                  default: '1965-11-12'
                  description: Birth date of account owner. Ex. '1965-11-12' for November 12, 1965
                place_of_birth:
                  type: string
                  description: Birth city of account owner.
                country_of_birth:
                  type: string
                  description: Country of birth - This two-letter country code complies with ISO 3166-1
                nationality:
                  type: string
                  description: Nationality - This two-letter country code complies with ISO 3166-1
                share:
                  type: integer
                  default: 25
                  description: Percentage of shares owned by this UBO (25% minimum)
                id_document[file]:
                  type: string
                  description: Passport or ID card - File to upload (jpg, gif, png, pdf)
                  format: binary
                id_document_back[file]:
                  type: string
                  description: Back of file to upload (jpg, gif, png, pdf). Required for id cards in Belgium and Italy
                  format: binary
              required:
              - decision_maker
              - id_number
              - pep
              - date_of_birth
              - place_of_birth
              - country_of_birth
              - nationality
              - share
  /ubo/ubo-statement.{_format}:
    delete:
      description: '### Information

        If you initiate an UBO statement with a wrong number of UBO, and if you don''t send all the UBO, You can delete this UBO statement and start a new one. If an UBO statement has been submitted (status WAITING or UPDATED), you can''t delete it.'
      operationId: delete_ubo-statement
      x-disableTryItOut: true
      parameters:
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '200':
          description: Success response UBO statement has been deleted.
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: Status code of the answer.
                    format: int32
                    type: integer
                  message:
                    description: Description of the answer.
                    type: string
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
      summary: Delete a UBO statement
      tags:
      - ubo
      security:
      - basicAuth: []
    get:
      description: '### Information

        Get the list of all UBOs and documents for a user-space. If an UBO is refused, you should send us a new UBO with https://professional.hipay.com/api/ubo.'
      operationId: get_ubo-statement
      parameters:
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: Status code of the answer.
                    format: int32
                    type: integer
                  message:
                    description: Description of the answer.
                    type: string
                  user_space_id:
                    description: User space id.
                    type: integer
                  ubo_statement_id:
                    description: Id of the UBO statement.
                    type: integer
                  ubo_statement_status_code:
                    description: '0: new, 1: waiting, 2: to check, 3: validated, 4: rejected, 5: updated.'
                    type: integer
                  ubo_statement_status:
                    description: Text version of ubo_statement_status_code..
                    type: string
                  ubo:
                    description: List of UBO.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: ID of the UBO.
                          format: int32
                          type: integer
                        status_code:
                          description: '0: new, 1: waiting, 2: to check, 3: identified, 4: rejected, 5: deleted, 6: updated.'
                          type: integer
                        status_label:
                          description: Text version of ubo[status_code].
                          type: string
                        documents:
                          description: List of the UBO.
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                description: ID of the UBO Document
                                format: int32
                                type: integer
                              status_code:
                                description: '0: new, 1: waiting, 2: validated, 3: refused, 4: deleted, 11: to check.'
                                type: integer
                              status_label:
                                description: Text version of ubo[status_code].
                                type: string
                              type_code:
                                description: '1: Passport or ID card, 2: Proof of address.'
                                type: integer
                              type_label:
                                description: Text version of ubo[type_code].
                                type: string
                              status_refused_code:
                                description: "\tIf an UBO is refused (status_code = 3), this is the reason. -1: Without detail, 1: Invalid date, 2: Unreadable, 3: Missing information, 4: Other, 6: Invalid document type."
                                type: string
                              status_refused_label:
                                description: Text version of ubo[status_refused_code].
                                type: string
        '400':
          description: Validation failed.
        '401':
          description: Authentication failed.
      summary: Get a UBO statement.
      tags:
      - ubo
      security:
      - basicAuth: []
    post:
      description: '### Information

        This is the first step of UBO statement submission. An UBO statement is a list of UBO (Ultimate Beneficial Owners).


        - Be sure to have all the data before starting an UBO statement.

        - 1 UBO = 1 shareholder with >25% of capital or voting rights)'
      operationId: post_ubo-statement
      parameters:
      - in: path
        name: _format
        required: true
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
      - description: Account ID if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-id
        schema:
          type: integer
      - description: Account login (email) if operations must be made on an account other than yours (you must have specific rights on this account).
        in: header
        name: php-auth-subaccount-login
        schema:
          type: string
      responses:
        '201':
          description: Success response
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: Status code of the answer.
                    format: int32
                    type: integer
                  message:
                    description: Description of the answer.
                    type: string
                  ubo_statement_id:
                    description: Id of the UBO statement.
                    type: integer
        '400':
          description: Validation failed.
        '401':
          description: Authentication failed.
      summary: Create a UBO statement
      tags:
      - ubo
      security:
      - basicAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nb_ubo:
                  type: integer
                  default: 0
                  description: 'How many UBO do you have to declare ? * `0` : no UBO to declare * maximum of `4` UBOs'
              required:
              - nb_ubo
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
